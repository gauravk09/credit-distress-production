<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Distress Model</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a1f2b; --muted:#6b7280; --line:#e5e7eb;
          --up:#d62728; --down:#2ca02c; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:11px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .result { display:none; }
  .verdict { display:flex; align-items:baseline; gap:14px; margin-bottom:4px; }
  .prob { font-size:40px; font-weight:700; }
  .badge { padding:4px 12px; border-radius:999px; font-weight:700; font-size:13px; }
  .flag { background:#fde8e8; color:var(--up); } .clear { background:#e7f6ec; color:var(--down); }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .row .name { width:180px; text-align:right; color:var(--muted); }
  .bar { height:14px; border-radius:3px; }
  .val { width:56px; font-variant-numeric:tabular-nums; }
  .err { color:var(--up); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Credit Distress Model</h1>
  <p class="sub">Calibrated XGBoost · served from the MLflow registry · SHAP explanations. Enter a borrower and score them.</p>

  <div class="card">
    <div class="grid" id="form"></div>
    <button id="go">Score borrower</button>
    <span class="err" id="err"></span>
  </div>

  <div class="card result" id="result">
    <div class="verdict">
      <span class="prob" id="prob"></span>
      <span class="badge" id="badge"></span>
    </div>
    <p class="muted" id="meta"></p>
    <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
    <p class="muted" style="margin:0 0 8px">Why (SHAP): each fact pushes the score up (red) or down (green), from the average.</p>
    <div id="waterfall"></div>
  </div>
</div>

<script>
const FIELDS = [
  ["revolving_utilization","Revolving utilization",0.35],["age","Age",42],
  ["times_30_59_days_late","Times 30–59 days late",0],["debt_ratio","Debt ratio",0.4],
  ["monthly_income","Monthly income",5000],["open_credit_lines","Open credit lines",7],
  ["times_90_days_late","Times 90+ days late",0],["real_estate_loans","Real-estate loans",1],
  ["times_60_89_days_late","Times 60–89 days late",0],["dependents","Dependents",1],
];
const form = document.getElementById("form");
FIELDS.forEach(([k,label,def])=>{
  form.insertAdjacentHTML("beforeend",
    `<div><label>${label}</label><input id="f_${k}" type="number" step="any" value="${def}"></div>`);
});

document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Scoring…";
  const body = {}; FIELDS.forEach(([k])=> body[k] = parseFloat(document.getElementById("f_"+k).value));
  try {
    const r = await fetch("predict?explain=true", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) { err.textContent = (d.detail||[]).map(e=>`${e.loc.at(-1)}: ${e.msg}`).join("; ") || "error"; return; }
    render(d);
  } catch(e) { err.textContent = "request failed: "+e; }
  finally { btn.disabled = false; btn.textContent = "Score borrower"; }
};

function render(d){
  document.getElementById("result").style.display = "block";
  document.getElementById("prob").textContent = (d.probability*100).toFixed(1)+"%";
  const badge = document.getElementById("badge");
  badge.textContent = d.decision.toUpperCase();
  badge.className = "badge "+d.decision;
  document.getElementById("meta").textContent =
    `threshold ${(d.threshold*100).toFixed(1)}%  ·  base rate ${(d.explanation.base_value*100).toFixed(1)}%`;
  const c = d.explanation.contributions, max = Math.max(...c.map(x=>Math.abs(x.shap)), 0.001);
  document.getElementById("waterfall").innerHTML = c.map(x=>{
    const w = Math.abs(x.shap)/max*180, up = x.shap>=0;
    return `<div class="row"><span class="name">${x.feature}=${x.value ?? "—"}</span>
      <span class="bar" style="width:${w}px;background:${up?'var(--up)':'var(--down)'}"></span>
      <span class="val">${x.shap>=0?'+':''}${x.shap.toFixed(3)}</span></div>`;
  }).join("");
}
</script>
</body>
</html>
