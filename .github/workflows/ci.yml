name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Test subset only (fast). Full project deps live in requirements.txt.
      - name: Install test deps
        run: pip install pandas numpy scikit-learn xgboost matplotlib pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
